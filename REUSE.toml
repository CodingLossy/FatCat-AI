# REUSE 规范(https://reuse.software)的批量标注:无法写注释头的文件(JSON、Markdown、锁文件等)在此声明。
version = 1

[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/*.toml",
    "pnpm-lock.yaml",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    ".npmrc",
    ".prettierignore",
    ".dockerignore",
    ".github/oasdiff-severity.txt",
    "NOTICE",
    "templates/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 尹绪柏 (Theodore Yin)"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
    "packages/shared/**/*.md",
    "packages/shared/**/*.json",
    "packages/plugin-sdk/**/*.md",
    "packages/plugin-sdk/**/*.json",
    "packages/client/**/*.md",
    "packages/client/**/*.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 尹绪柏 (Theodore Yin)"
SPDX-License-Identifier = "Apache-2.0"
