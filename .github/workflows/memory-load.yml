# 负载后的内存回落(ADR 0018 第 4 节规则 3、4):1 万封合成邮件同步 3 次,约 8 分钟,
# 所以只在 push 到 main 与手动触发时运行;PR 上只跑 ci.yml 中的空闲内存检查(规则 1、2)。
name: Memory under load

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail-sync:
    name: 10k-mail sync rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 构建好的服务器在 runner 上直接运行,Node 参数取自 docker/Dockerfile;本地假 IMAP,不连外网
      - name: Sync 10,000 synthetic mails three times and check rollback
        run: CHECK=1 pnpm perf:mail-sync
