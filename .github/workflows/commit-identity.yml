name: Commit identity

# 只在 PR 上运行:检查 merge-base(origin/<base 分支>, head.sha)..head.sha 中每个提交的作者、提交者与提交信息
# (scripts/check-commit-identity.mjs)。不用事件里的 base.sha:它可能已过期,会把 main 上由 GitHub 生成的
# 合并提交算进检查范围。job 名 `commit identity` 是 main 分支规则里的必过检查,不要改名。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: commit identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Self-test the identity check
        run: node --test scripts/check-commit-identity.test.mjs
      - name: Check author, committer and message of every PR commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")"
          node scripts/check-commit-identity.mjs "$MERGE_BASE" "$HEAD_SHA"
