#
# 叠加在 docker-compose.prod.yml 上,把 Caddy 换成带 DNSPod 插件的版本,用 DNS-01 验证拿证书。
# 用法(在 docker/ 目录下):
#   docker compose -f docker-compose.prod.yml -f docker-compose.dnspod.yml up -d --build
services:
  caddy:
    build:
      context: caddy
      dockerfile: Dockerfile.dnspod
    image: fatcat-ai-caddy-dnspod:local
    volumes:
      - ./caddy/Caddyfile.dnspod.example:/etc/caddy/Caddyfile:ro
    secrets:
      - tencentcloud_secret_id
      - tencentcloud_secret_key

secrets:
  tencentcloud_secret_id:
    file: ${TENCENTCLOUD_SECRET_ID_PATH:-./secrets/tencentcloud_secret_id}
  tencentcloud_secret_key:
    file: ${TENCENTCLOUD_SECRET_KEY_PATH:-./secrets/tencentcloud_secret_key}
