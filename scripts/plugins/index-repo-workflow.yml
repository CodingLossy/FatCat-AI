# CI for the official plugin index repository (CodingLossy/fatcat-plugins). Copy this file to
# .github/workflows/check-index.yml in that repository. See scripts/plugins/README.md.
#
# It never touches a signing key: there are no secrets in this workflow, and it only has read access.
# The checks run from a checkout of the FatCat-AI repository, so they always use the same schema,
# tar reader and rules as the client. FATCAT_AI_REF is a full commit SHA of FatCat-AI that was reviewed;
# update it by hand (see "Updating the pinned checks" in scripts/plugins/README.md) and never point it at a
# branch. The third-party actions below are still on major-version tags: pin them to commit SHAs in the
# index repository (for example with Dependabot) before relying on this workflow.
name: check index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FATCAT_AI_REF: c828e18b5814c93765917641b5d2e6b4e072cd2d # FatCat-AI main after the plugin market merge (#72)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: CodingLossy/FatCat-AI
          ref: ${{ env.FATCAT_AI_REF }}
          path: fatcat-ai
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fatcat-ai/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the schema and the package checks
        working-directory: fatcat-ai
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@fatcat-ai/shared --filter=@fatcat-ai/tools
      - name: Previous index (the base branch, or the previous commit on main)
        run: |
          base="${{ github.base_ref }}"
          if [ -n "$base" ]; then ref="origin/$base"; else ref="HEAD^"; fi
          git show "$ref:index.json" > previous.json 2>/dev/null || rm -f previous.json
      - name: Check index.json
        run: |
          args="--index index.json"
          if [ -f previous.json ]; then args="$args --previous previous.json"; fi
          node fatcat-ai/scripts/plugins/check-index.mjs $args
      - name: The published signature matches index.json (public keys only)
        if: ${{ hashFiles('index.json.sig') != '' }}
        run: node fatcat-ai/scripts/plugins/sign-index.mjs --verify
